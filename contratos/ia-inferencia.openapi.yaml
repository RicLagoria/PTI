openapi: 3.0.3
info:
  title: AgroVision - IA Inferencia API
  description: |
    Servicio de inferencia para detección de malezas y anomalías en teselas de ortomosaicos.

    Según la tarea del modelo activo las detecciones traen, además de la caja, el
    contorno de la mancha: con `tarea: segment` cada detección incluye
    `contorno_local`, y con `tarea: detect` no. El servicio sigue sin saber de
    geografía: todo son píxeles de la tesela recibida, identificada por un id
    opaco, y es cliente-api el que los lleva a coordenadas.
  version: 1.1.0
paths:
  /salud:
    get:
      summary: Chequeo de salud del servicio
      operationId: getSalud
      responses:
        '200':
          description: Servicio operativo
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado:
                    type: string
                    example: ok

  /modelo:
    get:
      summary: Metadatos del modelo activo
      operationId: getModelo
      responses:
        '200':
          description: Información del modelo activo
          content:
            application/json:
              schema:
                type: object
                required:
                  - version
                  - clases
                  - imgsz
                properties:
                  version:
                    type: string
                    example: v1
                  clases:
                    type: array
                    items:
                      type: string
                    example: ["maleza", "falla"]
                  imgsz:
                    type: integer
                    example: 640
                  tarea:
                    type: string
                    description: |
                      Qué devuelve el modelo activo. `segment` agrega el contorno de cada
                      detección; `detect` solo da la caja. Sale de los pesos, no de una
                      configuración: activar otra versión en ia-entrenamiento lo cambia.
                    enum: [detect, segment]
                    example: segment
                  metricas:
                    type: object
                    additionalProperties: true

  /detectar:
    post:
      summary: Detección por lote sobre teselas
      description: |
        Recibe teselas en una petición multipart y devuelve, en píxeles locales y asociadas
        a cada id de tesela, la caja de cada detección y —con un modelo de segmentación—
        el contorno de la mancha.
      operationId: postDetectar
      parameters:
        - name: conf
          in: query
          description: Umbral de confianza mínimo (0.0 a 1.0)
          required: false
          schema:
            type: number
            default: 0.10
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description: Colección de archivos de imagen donde cada clave o nombre de archivo es el identificador opaco de la celda.
      responses:
        '200':
          description: Detecciones en coordenadas locales de cada tesela
          content:
            application/json:
              schema:
                type: object
                required:
                  - version_modelo
                  - detecciones
                properties:
                  version_modelo:
                    type: string
                    example: v1
                  tarea:
                    type: string
                    description: Igual que en /modelo. Con `detect` ninguna detección trae contorno_local.
                    enum: [detect, segment]
                    example: segment
                  detecciones:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - clase
                        - confianza
                        - box_local
                      properties:
                        id:
                          type: string
                          example: "celda_1_4"
                        clase:
                          type: string
                          example: maleza
                        confianza:
                          type: number
                          example: 85.5
                        box_local:
                          type: array
                          description: Coordenadas [x1, y1, x2, y2] en píxeles de la tesela recibida
                          items:
                            type: number
                          example: [120.5, 45.0, 180.2, 98.4]
                        contorno_local:
                          type: array
                          description: |
                            Borde de la mancha detectada como [[x, y], ...] en píxeles de la
                            tesela recibida, ya simplificado (unas decenas de vértices, no los
                            cientos que tiene el borde de la máscara). El anillo no viene
                            cerrado: el último vértice no repite al primero.

                            Está solo con un modelo de segmentación, y puede faltar en una
                            detección concreta si su máscara es tan chica que no encierra área.
                          items:
                            type: array
                            items:
                              type: number
                            minItems: 2
                            maxItems: 2
                          minItems: 3
                          example: [[120.5, 45.0], [180.2, 52.1], [176.0, 98.4], [128.3, 90.2]]

