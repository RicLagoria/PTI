openapi: 3.0.3
info:
  title: AgroVision - IA Entrenamiento API
  description: |
    Servicio para gestión de datasets, ejecución de entrenamientos y registro de versiones
    de modelos YOLO.

    Un entrenamiento tiene dos ejes que no se piden igual:

    - **Qué entrena** (`tarea`): `segment` aprende el contorno de cada mancha y `detect`
      solo la caja que la encierra. No es un parámetro: viene con `pesos_base`, porque el
      .pt trae la cabeza entrenada para una cosa o la otra y no se puede seguir entrenando
      uno con las etiquetas del otro formato. De cada aporte se guardan los dos formatos al
      subirlo, así que un mismo aporte sirve para las dos tareas.
    - **Dónde entrena** (`dispositivo`): `cpu` o `gpu`. Se pide explícitamente; qué hay
      disponible lo dice `GET /dispositivos`.
    - **Hasta cuándo** (`epocas` y `paciencia`): `epocas` es el tope y `paciencia` corta
      antes si el mAP de validación deja de mejorar.
  version: 1.1.0
paths:
  /clases:
    get:
      summary: Taxonomía canónica de clases
      operationId: getClases
      responses:
        '200':
          description: Lista ordenada de clases
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /dispositivos:
    get:
      summary: Si se puede entrenar en GPU, y si no, qué falta
      description: |
        Describe lo que ve **la API**, no el worker: son contenedores distintos (la GPU se le
        reserva al worker), aunque en los dos compose corran en la misma máquina y desde la
        misma imagen. Alcanza para que entrenador-web habilite o no la opción; la palabra
        final la tiene el worker, que falla el trabajo en el momento si se pidió GPU y no la
        tiene, con `motivo` como mensaje de error.
      operationId: getDispositivos
      responses:
        '200':
          description: Dispositivos disponibles
          content:
            application/json:
              schema:
                type: object
                required: [gpu_disponible, motivo, torch_con_cuda, gpus, lote_cpu, lote_gpu]
                properties:
                  gpu_disponible:
                    type: boolean
                  motivo:
                    type: string
                    nullable: true
                    description: >
                      Qué falta para poder entrenar en GPU: que la imagen se construya con
                      las ruedas CUDA de torch, o que el contenedor tenga acceso a la placa.
                      null cuando la GPU está disponible.
                  torch_con_cuda:
                    type: boolean
                    description: Si el torch instalado sabe hablar con una GPU (false con las ruedas +cpu).
                  cuda:
                    type: string
                    nullable: true
                    description: Versión de CUDA con la que se compiló torch.
                  gpus:
                    type: array
                    items:
                      type: object
                      properties:
                        indice: {type: integer}
                        nombre: {type: string}
                        memoria_gb: {type: number}
                    example: [{indice: 0, nombre: "NVIDIA GeForce RTX 3080", memoria_gb: 10.0}]
                  lote_cpu:
                    type: integer
                    description: Imágenes por lote al entrenar en CPU (LOTE_CPU).
                    example: 2
                  lote_gpu:
                    type: integer
                    description: Imágenes por lote al entrenar en GPU (LOTE_GPU).
                    example: 16

  /datasets:
    get:
      summary: Lista de datasets cargados
      operationId: getDatasets
      responses:
        '200':
          description: Datasets registrados
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    nombre:
                      type: string
                    total_imagenes:
                      type: integer
                    total_anotaciones:
                      type: integer
                      description: Cajas convertidas, para entrenar detección.
                    total_contornos:
                      type: integer
                      description: Contornos convertidos, para entrenar segmentación.
                    contornos_de_caja:
                      type: integer
                      description: >
                        De esos contornos, cuántos son solo las 4 esquinas de un rectángulo
                        de labelme: entrenar segmentación con esos le enseña rectángulos.
                    contornos_descartados:
                      type: integer
                      description: Formas con caja pero sin contorno usable (una línea, o un polígono que el recorte dejó sin área).
                    tiene_segmentacion:
                      type: boolean
                      description: >
                        Si el aporte sirve para entrenar segmentación. Falta en los aportes
                        subidos antes de que se guardaran los contornos, que tampoco sirven.
                    fecha_creacion:
                      type: string
    post:
      summary: Subir dataset (ZIP con imágenes y JSONs de LabelMe)
      operationId: postDataset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - archivo
              properties:
                archivo:
                  type: string
                  format: binary
                nombre:
                  type: string
                fondos_implicitos:
                  type: boolean
                  default: false
                  description: >
                    Declarar como fondo (ejemplo negativo) las imágenes que no tienen
                    `.json`, en vez de ignorarlas. Hace falta porque labelme no guarda
                    una imagen en la que no se dibujó nada. Apagado por defecto: una
                    imagen que nadie revisó declarada como fondo le enseña al modelo que
                    la maleza que hay ahí no es maleza. El resultado informa cuántas
                    fueron en `fondos_declarados`.
      responses:
        '201':
          description: Dataset procesado y validado
          content:
            application/json:
              schema:
                type: object
        '400':
          description: >
            El aporte no se puede usar y no se guardó nada. Además de `mensaje`,
            trae `clases_desconocidas` (etiqueta -> cantidad) o `errores` (un
            texto por archivo), según el caso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: object
                    properties:
                      mensaje:
                        type: string
                      clases_desconocidas:
                        type: object
                        additionalProperties:
                          type: integer
                      clases_validas:
                        type: array
                        items:
                          type: string
                      errores:
                        type: array
                        items:
                          type: string
                      errores_omitidos:
                        type: integer
        '413':
          description: El ZIP supera MAX_DATASET_MB

  /datasets/{id}:
    delete:
      summary: Eliminar dataset
      operationId: deleteDataset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Dataset eliminado

  /datasets/{id}/ventanas:
    get:
      summary: Escalas gruesas que se pueden derivar de un aporte
      description: >
        Cuántas ventanas completas daría cada escala, sin generarlas. Una ventana
        de escala N son N×N teselas vecinas pegadas, y es "completa" solo si
        están las N² y todas etiquetadas.
      operationId: getVentanasDataset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Escalas y cuántas ventanas daría cada una
          content:
            application/json:
              schema:
                type: object
                required: [apto, escalas]
                properties:
                  apto:
                    type: boolean
                    description: Si del aporte se puede derivar escala gruesa.
                  motivo:
                    type: string
                    nullable: true
                    description: Por qué no se puede; null cuando sí.
                  paso_px:
                    type: integer
                    description: Lado de cada tesela, en píxeles.
                  escalas:
                    type: object
                    description: Ventanas completas por escala, con la escala como clave.
                    additionalProperties:
                      type: integer
        '404':
          description: Dataset no encontrado
    post:
      summary: Derivar aportes de escala gruesa
      description: >
        Pega N×N teselas vecinas del aporte, reduce cada ventana a 640 px y
        recompone las etiquetas. No hay que volver a subir nada: las teselas ya
        están guardadas con su posición en el nombre. Las manchas partidas por
        una costura interna se unen. Cada escala queda como un aporte nuevo.
      operationId: postVentanasDataset
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [escalas]
              properties:
                escalas:
                  type: array
                  minItems: 1
                  maxItems: 4
                  items:
                    type: integer
                    minimum: 2
                    maximum: 8
                  description: Teselas por lado de cada ventana.
      responses:
        '201':
          description: Aportes derivados, uno por escala
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: El aporte no sirve para derivar, o la escala no da ninguna ventana completa
        '404':
          description: Dataset no encontrado

  /entrenamientos:
    get:
      summary: Lista de trabajos de entrenamiento
      operationId: getEntrenamientos
      responses:
        '200':
          description: Lista de entrenamientos
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
    post:
      summary: Encolar nuevo trabajo de entrenamiento
      operationId: postEntrenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - datasets
              properties:
                datasets:
                  type: array
                  items:
                    type: string
                epocas:
                  type: integer
                  default: 50
                  minimum: 1
                  maximum: 300
                  description: >
                    Tope de épocas. Con `paciencia` distinta de 0 puede cortar antes.
                paciencia:
                  type: integer
                  default: 30
                  minimum: 0
                  maximum: 300
                  description: >
                    Early stopping: épocas seguidas sin mejorar después de las cuales se
                    corta, `0` lo desactiva. Mira el fitness de validación (mAP), no la
                    pérdida. No cambia qué modelo se publica: la versión siempre sale del
                    best.pt de la mejor época, así que cortar solo ahorra tiempo. Las épocas
                    que realmente corrió quedan en `metricas.epocas_entrenadas`.
                imgsz:
                  type: integer
                  default: 640
                  minimum: 320
                  maximum: 1280
                  multipleOf: 32
                pesos_base:
                  type: string
                  default: "yolov8n-seg.pt"
                  description: >
                    `yolov8n-seg.pt` (contornos), `yolov8n.pt` (cajas) o el nombre de una
                    versión del registro, que sigue entrenando esa versión con su misma
                    tarea. De acá sale la tarea del trabajo.
                dispositivo:
                  type: string
                  default: cpu
                  enum: [cpu, gpu]
                  description: >
                    Dónde entrena. `gpu` necesita que la imagen del worker esté construida
                    con las ruedas CUDA de torch y que el contenedor tenga acceso a la placa
                    (ver despliegue/compose.ia.gpu.yml); `GET /dispositivos` dice si se puede.
                    Si se pide igual y no está, el trabajo queda en estado fallido con el
                    motivo, en vez de entrenar en CPU sin avisar. Define el tamaño de lote:
                    LOTE_CPU o LOTE_GPU.
                fraccion_validacion:
                  type: number
                  default: 0.25
                  minimum: 0.1
                  maximum: 0.5
                  description: >
                    Parte de cada aporte que se separa para validación y para la
                    evaluación final. Por aporte se toma
                    min(n - 1, max(1, floor(n * fraccion + 0.5))) imágenes; un
                    aporte de una sola imagen va entero a entrenamiento.
      responses:
        '202':
          description: Entrenamiento encolado
        '400':
          description: >
            Algún dataset no existe (`datasets_inexistentes`), los pesos de
            partida no están permitidos (`pesos_base_validos`), o se pidieron unos
            pesos de segmentación con aportes que no tienen contornos
            (`datasets_sin_contornos`).

  /entrenamientos/{id}/cancelar:
    post:
      summary: Cancelar un entrenamiento pendiente o en ejecución
      description: >
        Pendiente: queda cancelado en el momento y ningún worker lo toma. En
        ejecución: el worker corta al terminar el lote en curso y no publica
        ninguna versión; hasta entonces el trabajo trae cancelacion_pedida=true.
        Si el worker no da señales hace más de 10 minutos (murió), se cancela
        sin esperarlo.
      operationId: cancelarEntrenamiento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: El trabajo, cancelado o con la cancelación pedida
        '404':
          description: No existe
        '409':
          description: Ya terminó (completado, fallido o cancelado)

  /entrenamientos/{id}/stream:
    get:
      summary: Streaming SSE de métricas y avance de entrenamiento
      operationId: streamEntrenamiento
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >
            Event stream SSE: manda el trabajo completo cada 2 s y corta al llegar
            a un estado final (completado, fallido o cancelado). En ejecución,
            `progreso` trae la fase (preparando, entrenando, evaluando), la
            `fraccion` de 0 a 1 (por lote), `transcurrido_s`, `segundos_restantes`
            (estimado, desde los primeros 10 s de entrenamiento) y `actualizado`.
            `intentos` es mayor que 1 si un worker dejó de responder y otro lo
            retomó desde cero.
          content:
            text/event-stream:
              schema:
                type: string

  /modelos:
    get:
      summary: Versiones registradas de modelos y sus métricas
      operationId: getModelos
      responses:
        '200':
          description: Modelos en el registro
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /modelos/activo/pesos:
    get:
      summary: Descarga del archivo .pt del modelo activo
      operationId: getPesosActivos
      responses:
        '200':
          description: Binario de pesos YOLO
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  /modelos/{v}/detalle:
    get:
      summary: Evaluación, historial por época y gráficos de una versión
      operationId: getDetalleModelo
      parameters:
        - name: v
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: >
            `evaluacion` es null en las versiones que no se entrenaron en el
            sistema (la semilla); para esas quedan los gráficos de `imagenes`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  tarea:
                    type: string
                    enum: [detect, segment]
                    description: Las versiones publicadas antes de que existiera segmentación son detect.
                  evaluacion:
                    nullable: true
                    type: object
                    description: >
                      Medida sobre las imágenes de validación del entrenamiento,
                      las mismas con que se eligió la mejor época: es optimista.
                    properties:
                      conjunto:
                        type: string
                      metricas:
                        type: object
                        description: >
                          Sobre la caja. En un modelo de segmentación la caja es la que
                          encierra la máscara, así que estas métricas dicen si encontró la
                          mancha, no si le dibujó bien el borde.
                        properties:
                          precision: {type: number}
                          recall: {type: number}
                          map50: {type: number}
                          map50_95: {type: number}
                      metricas_mascara:
                        type: object
                        nullable: true
                        description: >
                          Lo mismo medido sobre el contorno. null en los modelos de
                          detección. Un mAP de caja alto con uno de máscara bajo significa
                          que encuentra la maleza pero dibuja mal su borde.
                        properties:
                          precision: {type: number}
                          recall: {type: number}
                          map50: {type: number}
                          map50_95: {type: number}
                      umbral_recomendado:
                        type: number
                        nullable: true
                        description: Confianza que maximiza el F1 promedio entre clases
                      por_clase:
                        type: array
                        items:
                          type: object
                          properties:
                            clase: {type: string}
                            instancias: {type: integer}
                            precision: {type: number, nullable: true}
                            recall: {type: number, nullable: true}
                            map50: {type: number, nullable: true}
                            map50_95: {type: number, nullable: true}
                      matriz_confusion:
                        type: object
                        properties:
                          umbral: {type: number}
                          iou: {type: number}
                          etiquetas:
                            type: array
                            items: {type: string}
                            description: Las clases y al final "fondo"
                          filas_reales:
                            type: array
                            description: filas_reales[real][predicho] = cantidad de cajas
                            items:
                              type: array
                              items: {type: integer}
                      curvas_confianza:
                        type: object
                        nullable: true
                        properties:
                          confianza: {type: array, items: {type: number}}
                          precision: {type: array, items: {type: number}}
                          recall: {type: array, items: {type: number}}
                          f1: {type: array, items: {type: number}}
                  historial:
                    type: array
                    items:
                      type: object
                      properties:
                        epoca: {type: integer}
                        perdida_train: {type: number, nullable: true}
                        perdida_val: {type: number, nullable: true}
                        precision: {type: number, nullable: true}
                        recall: {type: number, nullable: true}
                        map50: {type: number, nullable: true}
                        map50_95: {type: number, nullable: true}
                  imagenes:
                    type: array
                    items: {type: string}
                    description: Gráficos de Ultralytics disponibles en /modelos/{v}/imagenes/{nombre}

  /modelos/{v}/imagenes/{nombre}:
    get:
      summary: Gráfico PNG generado por Ultralytics para una versión
      operationId: getImagenModelo
      parameters:
        - name: v
          in: path
          required: true
          schema:
            type: string
        - name: nombre
          in: path
          required: true
          schema:
            type: string
            enum:
              - confusion_matrix.png
              - confusion_matrix_normalized.png
              - results.png
              - BoxPR_curve.png
              - BoxF1_curve.png
              - BoxP_curve.png
              - BoxR_curve.png
      responses:
        '200':
          description: Imagen PNG
          content:
            image/png:
              schema:
                type: string
                format: binary

  /modelos/{v}/activar:
    post:
      summary: Activar versión específica como modelo en producción
      operationId: activarModelo
      parameters:
        - name: v
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Modelo activado exitosamente

