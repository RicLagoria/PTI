# Gateway del plano Cliente para el final de PDC (ver compose.pdc.yml).
#
# Es la única puerta de entrada: todo lo de afuera llega acá por HTTPS y el
# gateway reparte. La base, cliente-api e ia-inferencia no publican puertos.
#
#   navegador --HTTPS--> gateway --+-- /      --> cliente-web (la SPA)
#                                  +-- /api/  --> cliente-api x N (balanceo)
#
# Patrones: API Gateway (una sola puerta, TLS, límites y cabeceras en un solo
# lugar) y balanceo de carga round-robin entre réplicas sin estado.

# Log con a qué réplica fue cada pedido y cuánto tardó: con eso se ve el
# balanceo en vivo (docker compose logs -f gateway) y se mide en la prueba.
log_format balanceo '$remote_addr "$request" $status '
                    'replica=$upstream_addr t=${request_time}s';

# Anti fuerza bruta: 5 intentos de login por minuto por IP (ráfaga de 5).
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# Docker resuelve "cliente-api" a la IP de cada réplica; nginx las toma todas al
# arrancar y reparte en round-robin. Si se cambia la cantidad de réplicas hay
# que reiniciar el gateway (lo hace pdc/escalar.sh).
upstream api {
    server cliente-api:8000 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

# HTTP plano: solo redirige a HTTPS.
server {
    listen 80;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    # Certificado autofirmado de pdc/generar-certificado.sh (no va a git).
    ssl_certificate     /etc/nginx/certs/agrovision.crt;
    ssl_certificate_key /etc/nginx/certs/agrovision.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Cabeceras de seguridad para el navegador.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/access.log balanceo;

    # El tope de subida lo aplica el backend (MAX_UPLOAD_MB).
    client_max_body_size 0;

    location / {
        proxy_pass http://cliente-web:80;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api/auth/login;
    }

    location /api/ {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Muestra qué réplica atendió (útil en la demo del balanceo). Ojo: un
        # add_header acá anula los del server, por eso se repiten.
        add_header X-Atendido-Por $upstream_addr always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        # Si una réplica se cae, el pedido pasa a otra (failover).
        # El timeout de conexión corto hace que el salto sea casi inmediato.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;

        # Subidas grandes y análisis en vivo (SSE), igual que en cliente-web.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
