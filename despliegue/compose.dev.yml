services:
  ia-inferencia:
    build: ../project/servicios/ia-inferencia
    environment:
      MODEL_PATH: /datos/modelos/activo/best.pt
    volumes:
      - ../datos/modelos:/datos/modelos:ro
    ports:
      - "8001:8001"
    restart: unless-stopped

  cliente-api:
    build: ../project/servicios/cliente-api
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      IA_INFERENCIA_URL: http://ia-inferencia:8001
      UPLOAD_DIR: /datos/ortomosaicos
      MAX_UPLOAD_MB: 8192
      TAMANO_LOTE_MAX: 4
    volumes:
      - ../datos/ortomosaicos:/datos/ortomosaicos
    ports:
      - "8000:8000"
    depends_on:
      - ia-inferencia
    networks:
      default:
        aliases:
          - back
          - cliente-api
    restart: unless-stopped

  cliente-web:
    build: ../project/servicios/cliente-web
    ports:
      - "8080:80"
    depends_on:
      - cliente-api
    restart: unless-stopped

