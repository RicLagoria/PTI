services:
  ia-inferencia:
    build: ../project/servicios/ia-inferencia
    environment:
      MODEL_PATH: /datos/modelos/activo/best.pt
    volumes:
      - ../datos/modelos:/datos/modelos:ro
    ports:
      - "8001:8001"
    restart: unless-stopped

  ia-entrenamiento-api:
    build: ../project/servicios/ia-entrenamiento
    environment:
      MODELOS_DIR: /datos/modelos
      DATASETS_DIR: /datos/datasets
      TRABAJOS_DIR: /datos/trabajos
    volumes:
      - ../datos/modelos:/datos/modelos
      - ../datos/datasets:/datos/datasets
      - ../datos/trabajos:/datos/trabajos
      - ../contratos:/contratos:ro
    # Sin login, la API permite borrar aportes y cambiar el modelo activo: desde
    # afuera se llega solo a través de entrenador-web (su nginx usa la red interna
    # de compose). El puerto queda atado a 127.0.0.1 para "npm run dev" en la misma
    # máquina o un túnel SSH al servidor, no para la red.
    ports:
      - "127.0.0.1:8002:8002"
    restart: unless-stopped

  ia-entrenamiento-worker:
    build: ../project/servicios/ia-entrenamiento
    command: ["python", "worker/entrenador.py"]
    environment:
      MODELOS_DIR: /datos/modelos
      DATASETS_DIR: /datos/datasets
      TRABAJOS_DIR: /datos/trabajos
    volumes:
      - ../datos/modelos:/datos/modelos
      - ../datos/datasets:/datos/datasets
      - ../datos/trabajos:/datos/trabajos
      - ../contratos:/contratos:ro
    depends_on:
      - ia-entrenamiento-api
    restart: unless-stopped

  entrenador-web:
    build: ../project/servicios/entrenador-web
    ports:
      - "8003:80"
    depends_on:
      - ia-entrenamiento-api
    restart: unless-stopped
