server {
    listen 80;

    # El tope de subida lo aplica el backend (MAX_UPLOAD_MB)
    client_max_body_size 0;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA con react-router: cualquier ruta que no sea un archivo cae en index.html
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://back:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Subidas: pasar el archivo al backend a medida que llega, sin copiarlo antes a disco
        proxy_request_buffering off;
        # Análisis en vivo (SSE): entregar cada bloque apenas sale del backend
        proxy_buffering off;

        # La conversión a COG y el análisis pueden tardar varios minutos sin enviar datos
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
