server {
    listen 80;

    # El tope de subida lo aplica el backend (MAX_UPLOAD_MB)
    client_max_body_size 0;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA con react-router: cualquier ruta que no sea un archivo cae en index.html
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Resolver el nombre "back" en cada pedido (DNS interno de Docker) y no una sola vez al
        # arrancar: así la API puede detenerse o recrearse con otra IP sin reiniciar el gateway
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://back:8000;
        # Con proxy_pass a una variable nginx no recorta el prefijo, así que se quita a mano
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        # Si la API está caída, fallar rápido con 502 en vez de colgar el pedido 60 s
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Subidas: pasar el archivo al backend a medida que llega, sin copiarlo antes a disco
        proxy_request_buffering off;
        # Análisis en vivo (SSE): entregar cada bloque apenas sale del backend
        proxy_buffering off;

        # La conversión a COG y el análisis pueden tardar varios minutos sin enviar datos
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
