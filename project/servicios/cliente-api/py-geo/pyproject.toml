[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-geo"
version = "0.1.0"
description = "Módulo geoespacial para lectura por ventanas, grillas de teselas y georreferenciación de ortomosaicos"
authors = [{ name = "PTI 2026 Team" }]
dependencies = [
    "rasterio>=1.4.0",
    "numpy>=1.24.0",
    "opencv-python>=4.8.0"
]
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["py_geo*"]
